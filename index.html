<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Nova - Secret Empire Association</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Header -->
  <header class="app-header">
    <div class="brand-logo">
      <div class="logo-circle">SN</div>
      <div class="brand-title">SECRET NOVA</div>
    </div>
    <div class="user-pill">
      <div class="user-avatar" id="user-avatar-letter">H</div>
      <span id="user-display-name">Hemant</span>
    </div>
  </header>

  <!-- Wallet Bar -->
  <div class="wallet-bar">
    <div class="wallet-chip">🪙 <span class="val">12,450</span></div>
    <div class="wallet-chip">💎 <span class="val">860</span></div>
    <div class="wallet-chip">⚡ <span class="val">2,350</span></div>
  </div>

  <!-- Dynamic Content Loaded from Individual Files -->
  <main id="main-content" class="main-container">
    <!-- Default Home content will be injected here via script.js -->
  </main>

  <!-- Gamee Style Bottom Navigation Bar -->
  <nav class="gamee-nav">
    <button class="nav-btn active" onclick="loadScreen('home.html', this)">
      <span class="icon">🏠</span>
      <span>Home</span>
    </button>
    <button class="nav-btn" onclick="loadScreen('games.html', this)">
      <span class="icon">🎮</span>
      <span>Games</span>
    </button>
    <!-- Center Action Mic Button -->
    <button class="nav-center-btn" onclick="alert('Secret Empire Voice Chat Hub')">
      🎙️
    </button>
    <button class="nav-btn" onclick="loadScreen('rank.html', this)">
      <span class="icon">🏆</span>
      <span>Rank</span>
    </button>
    <button class="nav-btn" onclick="loadScreen('profile.html', this)">
      <span class="icon">👤</span>
      <span>Profile</span>
    </button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
