<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Nova - Play, Earn, Compete, Repeat.</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="theme.css">
</head>
<body>

  <!-- Top Header -->
  <header class="app-header">
    <div class="brand-logo">
      <div class="logo-circle">SN</div>
      <div class="brand-title">SECRET NOVA</div>
    </div>
    <div class="user-pill">
      <div class="user-avatar" id="user-avatar-letter">H</div>
      <span id="user-display-name">Hemant</span>
    </div>
  </header>

  <!-- Wallet Bar -->
  <div class="wallet-bar">
    <div class="wallet-chip">🪙 <span class="val">12,450</span></div>
    <div class="wallet-chip">💎 <span class="val">860</span></div>
    <div class="wallet-chip">⚡ <span class="val">2,350</span></div>
  </div>

  <!-- Dynamic Content Container -->
  <main id="main-content" class="main-container">
    <!-- Default content loaded via JS -->
  </main>

  <!-- Bottom Navigation Bar (Updated) -->
  <nav class="gamee-nav">
    <button class="nav-btn" onclick="switchTab('shop', this)">
      <span class="icon">🛒</span>
      <span>Nova Shop</span>
    </button>
    <button class="nav-btn" onclick="switchTab('games', this)">
      <span class="icon">🎮</span>
      <span>Games</span>
    </button>
    <button class="nav-center-btn active" onclick="switchTab('home', this)">
      🏠
    </button>
    <button class="nav-btn" onclick="switchTab('rank', this)">
      <span class="icon">🏆</span>
      <span>Rank</span>
    </button>
    <button class="nav-btn" onclick="switchTab('profile', this)">
      <span class="icon">👤</span>
      <span>Profile</span>
    </button>
  </nav>

  <!-- JS Modules Load -->
  <script src="js/telegram-auth.js"></script>
  <script src="js/nova-home.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/bottom-nav.js"></script>
</body>
</html>
